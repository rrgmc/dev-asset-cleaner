name: build
# Pull request runs show the PR number. An empty run-name keeps GitHub's default title.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || '' }}

on:
  # Work branches build through their pull request, so a push to one does not build twice.
  # Tags start release.yml, which builds and tests on its own.
  push:
    branches: [master]
  # labeled/unlabeled: adding the no-changelog label re-runs the changelog check.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# No job writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master all finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Finds whether anything that the build reads changed. It does not read *.md files, docs/,
  # Taskfile.yml, scripts/release-macos.sh (only release.yml runs it), .gitignore,
  # .editorconfig and .github/personal-rules.yml. LICENSE counts, because the install step
  # ships it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            # A new branch: compare with the default branch.
            range="origin/$DEFAULT_BRANCH...$GITHUB_SHA"
          fi
          # When the range cannot be read (a force push, say), build.
          if ! files=$(git diff --name-only "$range"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          ignored='(\.md$|^docs/|^Taskfile\.yml$|^scripts/release-macos\.sh$|^\.gitignore$|^\.editorconfig$|^\.github/personal-rules\.yml$|^$)'
          if printf '%s\n' "$files" | grep -qvE "$ignored"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # The runner's Visual Studio version changes over time; Ninja works with any.
            preset: windows-ninja
            setup: pwsh -File scripts/setup.ps1
          - os: macos-latest
            preset: macos
            setup: sh scripts/setup.sh
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/setup.*') }}

      - name: Download Qt
        run: ${{ matrix.setup }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: cmake --install build/${{ matrix.preset }} --config Release --prefix "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: dev-asset-cleaner-${{ matrix.preset }}
          path: dist

  # Checks the fragments in changelog.d/ (see changelog.d/README.md). A pull request that
  # changes code needs one, or the no-changelog label.
  changelog:
    needs: changes
    if: github.event_name == 'pull_request'
    uses: RangelReale/personal-ai-rules/.github/workflows/changelog-check.yml@v0.5.1
    with:
      kind: ${{ needs.changes.outputs.code == 'true' && 'code' || 'docs' }}

  # The one check that branch protection requires. It passes when every other job passed or
  # was skipped (the build for a documentation-only change, the changelog check on master).
  # A skipped matrix job reports one check without the matrix in its name, so the build jobs
  # themselves cannot be required. List every other job in needs.
  ci:
    needs: [changes, build, changelog]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
