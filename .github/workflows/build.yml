name: build
# Pull request runs show the PR number. An empty run-name keeps GitHub's default title.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || '' }}

on:
  # Tags start release.yml, which builds and tests on its own.
  push:
    branches: ['**']
  pull_request:

jobs:
  # Finds whether anything other than documentation changed. Documentation is every *.md file
  # and the docs/ folder; LICENSE is not, because the install step ships it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            # A new branch: compare with the default branch.
            range="origin/$DEFAULT_BRANCH...$GITHUB_SHA"
          fi
          # When the range cannot be read (a force push, say), build.
          if ! files=$(git diff --name-only "$range"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # The runner's Visual Studio version changes over time; Ninja works with any.
            preset: windows-ninja
            setup: pwsh -File scripts/setup.ps1
          - os: macos-latest
            preset: macos
            setup: sh scripts/setup.sh
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/setup.*') }}

      - name: Download Qt
        run: ${{ matrix.setup }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: cmake --install build/${{ matrix.preset }} --config Release --prefix "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: dev-asset-cleaner-${{ matrix.preset }}
          path: dist

  # The one check that branch protection requires. It passes when the build passed or was
  # skipped for a documentation-only change. A skipped matrix job reports one check without
  # the matrix in its name, so the build jobs themselves cannot be required.
  ci:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, build: $BUILD"
          [ "$CHANGES" = success ] && { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; }
